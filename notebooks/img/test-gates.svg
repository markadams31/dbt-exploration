<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <!-- Opaque canvas: renders identically on light and dark GitHub themes. -->
  <rect width="920" height="430" fill="#ffffff" rx="6"/>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>

  <text x="24" y="28" fill="#1f2328" font-weight="bold" font-size="13">When does a failing test actually stop the build?</text>
  <text x="24" y="46" fill="#59636e">dbt adds a test → model edge only if everything the test touches is already upstream of that model</text>

  <!-- ── PANEL A ────────────────────────────────────────────────────── -->
  <rect x="20" y="62" width="430" height="330" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="235" y="86" text-anchor="middle" fill="#1a7f37" font-weight="bold" font-size="12">one model upstream: it gates</text>

  <rect x="44" y="100" width="382" height="30" rx="4" fill="#fff8c5" stroke="#bf8700"/>
  <text x="235" y="120" text-anchor="middle" fill="#1f2328" font-size="10">not_null( stg_orders.customer_id )</text>
  <text x="235" y="150" text-anchor="middle" fill="#59636e" font-size="10">
    touches <tspan fill="#1f2328" font-weight="bold">{ stg_orders }</tspan>
  </text>

  <line x1="235" y1="160" x2="235" y2="184" stroke="#59636e" marker-end="url(#g)"/>

  <rect x="44" y="190" width="382" height="30" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="235" y="210" text-anchor="middle" fill="#1f2328" font-size="10">int_orders__enriched</text>
  <text x="235" y="240" text-anchor="middle" fill="#59636e" font-size="10">
    upstream <tspan fill="#1f2328" font-weight="bold">{ stg_orders, stg_products }</tspan>
  </text>

  <rect x="60" y="256" width="350" height="30" rx="4" fill="#ffffff" stroke="#1a7f37"/>
  <text x="235" y="276" text-anchor="middle" fill="#116329" font-size="10" font-weight="bold">
    { stg_orders } ⊆ { stg_orders, stg_products } ✓
  </text>

  <rect x="44" y="304" width="382" height="66" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="235" y="325" text-anchor="middle" fill="#116329" font-size="10" font-weight="bold">edge added: the model waits</text>
  <text x="235" y="343" text-anchor="middle" fill="#116329" font-size="10">test fails → 11 nodes skipped</text>
  <text x="235" y="360" text-anchor="middle" fill="#116329" font-size="10">the bad row never reaches a mart</text>

  <!-- ── PANEL B ────────────────────────────────────────────────────── -->
  <rect x="470" y="62" width="430" height="330" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="685" y="86" text-anchor="middle" fill="#cf222e" font-weight="bold" font-size="12">two models upstream: here, it does not</text>

  <rect x="494" y="100" width="382" height="30" rx="4" fill="#fff8c5" stroke="#bf8700"/>
  <text x="685" y="120" text-anchor="middle" fill="#1f2328" font-size="10">relationships( stg_orders.customer_id → stg_customers )</text>
  <text x="685" y="150" text-anchor="middle" fill="#59636e" font-size="10">
    touches <tspan fill="#1f2328" font-weight="bold">{ stg_orders, stg_customers }</tspan>
  </text>

  <line x1="685" y1="160" x2="685" y2="184" stroke="#cf222e" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="742" y="176" fill="#cf222e" font-size="9" font-style="italic">no edge</text>

  <rect x="494" y="190" width="382" height="30" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="685" y="210" text-anchor="middle" fill="#1f2328" font-size="10">int_orders__enriched</text>
  <text x="685" y="240" text-anchor="middle" fill="#59636e" font-size="10">
    upstream <tspan fill="#1f2328" font-weight="bold">{ stg_orders, stg_products }</tspan>
  </text>

  <rect x="510" y="256" width="350" height="30" rx="4" fill="#ffffff" stroke="#cf222e"/>
  <text x="685" y="276" text-anchor="middle" fill="#82071e" font-size="10" font-weight="bold">
    stg_customers is not upstream ✗
  </text>

  <rect x="494" y="304" width="382" height="66" rx="4" fill="#ffebe9" stroke="#cf222e"/>
  <text x="685" y="325" text-anchor="middle" fill="#82071e" font-size="10" font-weight="bold">no edge: the model runs anyway</text>
  <text x="685" y="343" text-anchor="middle" fill="#82071e" font-size="10">test fails → 0 nodes skipped</text>
  <text x="685" y="360" text-anchor="middle" fill="#82071e" font-size="10">the build goes red with the mart already wrong</text>

  <text x="460" y="414" text-anchor="middle" fill="#59636e" font-size="10">
    measured, not quoted: the rule is <tspan font-family="ui-monospace" fill="#1f2328">add_test_edges</tspan> in dbt-core's compilation.py
  </text>
</svg>
