<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <!-- Opaque canvas: renders identically on light and dark GitHub themes. -->
  <rect width="920" height="350" fill="#ffffff" rx="6"/>

  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>

  <!-- column bands -->
  <g fill="#f6f8fa">
    <rect x="16"  y="66" width="182" height="234" rx="6"/>
    <rect x="242" y="66" width="216" height="234" rx="6"/>
    <rect x="502" y="66" width="196" height="234" rx="6"/>
    <rect x="732" y="66" width="176" height="234" rx="6"/>
  </g>

  <!-- column headings: name, then the layer's one job -->
  <g font-weight="bold" font-size="13" fill="#1f2328">
    <text x="107" y="30" text-anchor="middle">raw</text>
    <text x="350" y="30" text-anchor="middle">staging</text>
    <text x="600" y="30" text-anchor="middle">intermediate</text>
    <text x="820" y="30" text-anchor="middle">marts</text>
  </g>
  <g font-size="10" fill="#59636e">
    <text x="107" y="47" text-anchor="middle">the landing zone</text>
    <text x="107" y="60" text-anchor="middle">not ours to change</text>
    <text x="350" y="47" text-anchor="middle">one model per source table</text>
    <text x="350" y="60" text-anchor="middle">rename · retype · views</text>
    <text x="600" y="47" text-anchor="middle">business joins</text>
    <text x="600" y="60" text-anchor="middle">no aggregation · views</text>
    <text x="820" y="47" text-anchor="middle">what analysts query</text>
    <text x="820" y="60" text-anchor="middle">tables</text>
  </g>

  <!-- raw -->
  <g stroke="#8250df" fill="#fbefff">
    <rect x="32" y="87"  width="150" height="26" rx="4"/>
    <rect x="32" y="147" width="150" height="26" rx="4"/>
    <rect x="32" y="207" width="150" height="26" rx="4"/>
  </g>
  <g fill="#1f2328" font-size="10">
    <text x="107" y="104" text-anchor="middle">orders</text>
    <text x="107" y="164" text-anchor="middle">products</text>
    <text x="107" y="224" text-anchor="middle">customers</text>
  </g>

  <!-- staging -->
  <g stroke="#0969da" fill="#ddf4ff">
    <rect x="258" y="87"  width="184" height="26" rx="4"/>
    <rect x="258" y="147" width="184" height="26" rx="4"/>
    <rect x="258" y="207" width="184" height="26" rx="4"/>
  </g>
  <g fill="#1f2328" font-size="10">
    <text x="350" y="104" text-anchor="middle">stg_shop__orders</text>
    <text x="350" y="164" text-anchor="middle">stg_shop__products</text>
    <text x="350" y="224" text-anchor="middle">stg_shop__customers</text>
  </g>

  <!-- intermediate -->
  <g stroke="#0969da" fill="#ddf4ff">
    <rect x="518" y="117" width="164" height="26" rx="4"/>
  </g>
  <text x="600" y="134" text-anchor="middle" fill="#1f2328" font-size="10">int_orders__enriched</text>

  <!-- marts -->
  <g stroke="#116329" fill="#dafbe1">
    <rect x="748" y="117" width="144" height="26" rx="4"/>
    <rect x="748" y="192" width="144" height="26" rx="4"/>
    <rect x="748" y="267" width="144" height="26" rx="4"/>
  </g>
  <g fill="#1f2328" font-size="10">
    <text x="820" y="134" text-anchor="middle">fct_orders</text>
    <text x="820" y="209" text-anchor="middle">fct_daily_revenue</text>
    <text x="820" y="284" text-anchor="middle">dim_customers</text>
  </g>

  <!-- edges: nothing crosses a node -->
  <g stroke="#59636e" fill="none" marker-end="url(#m)">
    <line x1="182" y1="100" x2="255" y2="100"/>
    <line x1="182" y1="160" x2="255" y2="160"/>
    <line x1="182" y1="220" x2="255" y2="220"/>
    <line x1="442" y1="100" x2="515" y2="124"/>
    <line x1="442" y1="160" x2="515" y2="136"/>
    <line x1="682" y1="130" x2="745" y2="130"/>
    <line x1="820" y1="143" x2="820" y2="189"/>
    <path d="M 442 220 C 580 220, 620 280, 745 280"/>
  </g>

  <text x="460" y="326" text-anchor="middle" fill="#59636e" font-size="10">
    the shape of almost every dbt project · payments, the seed and the snapshot are omitted here for clarity
  </text>
</svg>
