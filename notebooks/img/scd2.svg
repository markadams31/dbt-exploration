<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <!-- Opaque canvas: renders identically on light and dark GitHub themes. -->
  <rect width="920" height="360" fill="#ffffff" rx="6"/>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>

  <text x="24" y="28" fill="#1f2328" font-weight="bold" font-size="13">What a snapshot records</text>
  <text x="24" y="46" fill="#59636e">the source keeps one row per customer · the snapshot keeps one row per version</text>

  <!-- source: overwritten in place -->
  <text x="24" y="92" fill="#1f2328" font-weight="bold" font-size="11">raw.customers</text>
  <text x="24" y="107" fill="#59636e" font-size="10">overwritten</text>

  <g stroke="#8250df" fill="#fbefff">
    <rect x="180" y="80" width="150" height="32" rx="4"/>
    <rect x="470" y="80" width="150" height="32" rx="4"/>
    <rect x="720" y="80" width="150" height="32" rx="4"/>
  </g>
  <g fill="#1f2328" font-size="10" text-anchor="middle">
    <text x="255" y="100">state = QLD</text>
    <text x="545" y="100">state = NSW</text>
    <text x="795" y="100">(deleted)</text>
  </g>
  <g fill="#59636e" font-size="9" text-anchor="middle">
    <text x="255" y="128">10 Jun</text>
    <text x="545" y="128">30 Jul</text>
    <text x="795" y="128">noticed 31 Jul</text>
  </g>
  <g stroke="#8250df" fill="none" marker-end="url(#s)" stroke-dasharray="4 3">
    <line x1="330" y1="96" x2="466" y2="96"/>
    <line x1="620" y1="96" x2="716" y2="96"/>
  </g>
  <text x="398" y="88" text-anchor="middle" fill="#8250df" font-size="9">overwrite: old value gone</text>

  <!-- the snapshot run -->
  <text x="452" y="164" text-anchor="middle" fill="#1a7f37" font-size="10" font-weight="bold">dbt snapshot compares, then appends</text>
  <line x1="452" y1="140" x2="452" y2="158" stroke="#1a7f37" marker-end="url(#s)"/>
  <line x1="452" y1="170" x2="452" y2="192" stroke="#1a7f37" marker-end="url(#s)"/>

  <!-- snapshot: append-only versions -->
  <text x="24" y="230" fill="#1f2328" font-weight="bold" font-size="11">customers_snapshot</text>
  <text x="24" y="245" fill="#59636e" font-size="10">append-only</text>

  <!-- version bars along a timeline -->
  <line x1="180" y1="296" x2="880" y2="296" stroke="#59636e"/>
  <g stroke="#59636e">
    <line x1="180" y1="292" x2="180" y2="300"/>
    <line x1="470" y1="292" x2="470" y2="300"/>
    <line x1="720" y1="292" x2="720" y2="300"/>
  </g>
  <g fill="#59636e" font-size="9" text-anchor="middle">
    <text x="180" y="314">10 Jun</text>
    <text x="470" y="314">30 Jul</text>
    <text x="720" y="314">31 Jul</text>
  </g>

  <rect x="180" y="212" width="290" height="30" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="325" y="232" text-anchor="middle" fill="#1f2328" font-size="10">QLD</text>
  <rect x="470" y="212" width="250" height="30" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="595" y="232" text-anchor="middle" fill="#1f2328" font-size="10">NSW</text>
  <rect x="720" y="212" width="160" height="30" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-dasharray="4 3"/>
  <text x="800" y="232" text-anchor="middle" fill="#59636e" font-size="10">deleted</text>

  <!-- validity boundaries -->
  <g stroke="#0969da" stroke-dasharray="3 3">
    <line x1="180" y1="242" x2="180" y2="292"/>
    <line x1="470" y1="242" x2="470" y2="292"/>
    <line x1="720" y1="242" x2="720" y2="292"/>
  </g>
  <g fill="#0969da" font-size="9">
    <text x="186" y="262">valid_from</text>
    <text x="476" y="262">valid_to / valid_from</text>
    <text x="726" y="262">valid_to</text>
  </g>

  <text x="530" y="344" text-anchor="middle" fill="#59636e" font-size="10">
    every row carries the interval during which it was true; <tspan font-family="ui-monospace" fill="#1f2328">dbt_valid_to IS NULL</tspan> means "still true today"
  </text>
</svg>
