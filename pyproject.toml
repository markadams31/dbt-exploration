[project]
name = "dbt-exploration"
version = "0.1.0"
description = "A dbt lab against live SQL Server: real upstream chaos, verified outcomes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Pin the minor: adapter behaviour is half of what this lab documents.
    # 1.10.1 (+ dbt-core 1.12.0) verified against SQL Server 2025 here.
    "dbt-sqlserver~=1.10",
    "pyodbc~=5.2",
    "rich~=14.0",
    "pandas>=2.2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
]

[project.scripts]
setup = "lab.cli:setup"
check = "lab.cli:check"
reset = "lab.cli:reset"
teardown = "lab.cli:teardown"

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "ruff~=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.format]
# Notebook cells are laid out by hand for the rendered page (compact literals
# keep a whole scenario on one screen), so the formatter leaves them alone.
# They are still linted.
exclude = ["*.ipynb"]
